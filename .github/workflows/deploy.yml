# Syntax check → deploy backend to EC2.
#
# Repository secret (required):
#   SSH_PRIVATE_KEY  = contents of hairone-server.pem
#
# Optional variables:
#   SSH_HOST, SSH_USER, SSH_PORT, BACKEND_DEPLOY_PATH, PM2_APP_NAME
#
# Never uploads .env (must already exist on the server).

name: Deploy

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: API
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ vars.SSH_HOST || '3.85.219.147' }}
      SSH_USER: ${{ vars.SSH_USER || 'ec2-user' }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.BACKEND_DEPLOY_PATH || '/home/ec2-user/hairone/backend' }}
      PM2_APP_NAME: ${{ vars.PM2_APP_NAME || 'hairone-backend' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Syntax check
        working-directory: backend
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync backend (keep remote .env)
        run: |
          rsync -avz --delete \
            --exclude node_modules \
            --exclude .env \
            --exclude .git \
            --exclude '*.log' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            backend/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

      - name: Install deps and restart pm2
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "${SSH_USER}@${SSH_HOST}" \
            "set -e
             cd '${DEPLOY_PATH}'
             if [ ! -f .env ]; then
               echo 'ERROR: missing .env on server at ${DEPLOY_PATH}/.env'
               exit 1
             fi
             npm ci --omit=dev
             if pm2 describe '${PM2_APP_NAME}' >/dev/null 2>&1; then
               pm2 restart '${PM2_APP_NAME}' --update-env
             else
               pm2 start src/index.js --name '${PM2_APP_NAME}'
             fi
             pm2 save
             pm2 status '${PM2_APP_NAME}'"
